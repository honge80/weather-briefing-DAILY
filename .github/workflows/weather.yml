name: Daily Aviation Weather Briefing

on:
  schedule:
    # UTC 기준 21:00 (한국시간 06:00), UTC 기준 06:00 (한국시간 15:00) 실행
    - cron: '0 21,6 * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 파이썬 스크립트 실행
        env:
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
        run: python daily_weather_briefing.py
